name: Android-App bauen

# Ein neues Release (v<VERSION>) entsteht nur, wenn die Versionsnummer in version.js erhöht wurde.
# Manuell gestartet ("Run workflow") wird immer gebaut; die APK der aktuellen Version wird dann ersetzt.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 */3 * *'   # alle 3 Tage: Signierschlüssel im Cache frisch halten

permissions:
  contents: write

jobs:
  schluessel-frisch-halten:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Signierschlüssel abrufen (zählt als Zugriff)
        uses: actions/cache/restore@v4
        with:
          path: ~/einkauf-signatur.keystore
          key: einkauf-signatur-v1

  pruefen:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      bauen: ${{ steps.v.outputs.bauen }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummer lesen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" version.js)
          [ -n "$VERSION" ] || { echo "::error::Keine VERSION in version.js"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "bauen=nein" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION gibt es schon – kein neues Release. Für ein Update version.js hochzählen."
          else
            echo "bauen=ja" >> $GITHUB_OUTPUT
          fi

      # Ältere Releases ohne Uhrzeit im Titel nachträglich ergänzen ("… (16.11.2026)" → "… (16.11.2026 09:47)")
      - name: Release-Titel mit Uhrzeit ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,name,createdAt,isLatest \
            -q 'sort_by(.createdAt)[] | select(.tagName|startswith("v")) | select(.name|test("\\(\\d\\d\\.\\d\\d\\.\\d{4}\\)$")) | [.tagName,.createdAt,(.isLatest|tostring)] | @tsv' |
          while IFS=$'\t' read -r tag created latest; do
            wann=$(TZ=Europe/Berlin date -d "$created" '+%d.%m.%Y %H:%M')
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --title "Einkaufsliste ${tag#v} ($wann)" --latest="$latest"
            echo "$tag → $wann"
          done

      - name: Release-Beschreibungen aus changelog.js aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node changelog.test.mjs
          LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          for v in $(node release-text.mjs --alle); do
            BODY=$(gh release view "v$v" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null) || { echo "v$v: noch kein Release"; continue; }
            node release-text.mjs "$v" > neu.md
            if [ "$(printf '%s' "$BODY" | tr -d '\r')" != "$(cat neu.md)" ]; then
              [ "v$v" = "$LATEST" ] && L=true || L=false
              gh release edit "v$v" -R "$GITHUB_REPOSITORY" --notes-file neu.md --latest="$L"
              echo "v$v: Beschreibung aktualisiert"
            else
              echo "v$v: unverändert"
            fi
          done

  apk:
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web-Dateien nach www kopieren
        run: |
          mkdir -p www
          cp -r index.html app.js merge.js sort.js version.js catalog.js changelog.js sprache.js style.css manifest.webmanifest manifest-lokal.webmanifest icons www/

      - name: Einrichtungslink einbauen (Secret EINRICHTUNGSLINK)
        env:
          LINK: ${{ secrets.EINRICHTUNGSLINK }}
        run: |
          if [ -n "$LINK" ]; then
            node -e 'require("fs").writeFileSync("www/preset.json", JSON.stringify({ link: process.env.LINK.trim() }))'
            echo "Einrichtungslink eingebaut."
          else
            echo "::warning::Kein Secret EINRICHTUNGSLINK gesetzt – App muss von Hand eingerichtet werden."
          fi

      - name: Capacitor installieren und Android-Projekt anlegen
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      # Gleicher Signierschlüssel bei jedem Build, sonst meldet Android beim Update "App nicht installiert".
      # Der Schlüssel liegt im Actions-Cache; der Job "schluessel-frisch-halten" greift alle 3 Tage darauf zu,
      # damit GitHub ihn nicht nach 7 Tagen ohne Zugriff löscht.
      - name: Signierschlüssel aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/einkauf-signatur.keystore
          key: einkauf-signatur-v1

      - name: Signierschlüssel anlegen (nur beim allerersten Mal)
        run: |
          KS=~/einkauf-signatur.keystore
          if [ ! -f "$KS" ]; then
            echo "::warning::Neuer Signierschlüssel erzeugt – diese Version muss einmal per Deinstallieren/Neu-Installieren aufgespielt werden."
            keytool -genkeypair -keystore "$KS" -storepass android -alias einkauf -keypass android \
              -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Einkaufsliste,O=racerman76,C=DE"
          fi
          keytool -list -keystore "$KS" -storepass android | grep -i fingerprint

      # Baut aus dem Android-Projekt eine APK: Symbol, Versionsnummer, Signatur setzen, dann Gradle
      - name: Bau-Hilfsskript anlegen
        run: |
          cat > apk-bauen.sh <<'SKRIPT'
          set -e
          SYMBOL="$1"; ZIEL="$2"; KS=~/einkauf-signatur.keystore
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*dpi; do cp "$SYMBOL" $d/ic_launcher.png; cp "$SYMBOL" $d/ic_launcher_round.png; done
          sed -i -E "s/versionCode [0-9]+/versionCode $RUN_NR/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          printf '\nandroid {\n  signingConfigs { debug { storeFile file("%s"); storePassword "android"; keyAlias "einkauf"; keyPassword "android" } }\n  buildTypes { debug { signingConfig signingConfigs.debug } }\n}\n' "$KS" >> android/app/build.gradle
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$ZIEL"
          SKRIPT

      - name: APK bauen (GitHub-Version)
        env:
          RUN_NR: ${{ github.run_number }}
        run: bash apk-bauen.sh icons/icon-192.png Einkaufsliste.apk

      # Zweite, eigenständige App: speichert nur auf dem Gerät (kein GitHub, kein Token).
      # Eigene App-ID → lässt sich neben der GitHub-Version installieren.
      - name: APK bauen (lokale Version)
        env:
          RUN_NR: ${{ github.run_number }}
        run: |
          rm -rf android www/preset.json
          sed -i 's#<head>#<head>\n  <script>window.EK_LOKAL = true;</script>#' www/index.html
          grep -n "EK_LOKAL = true" www/index.html
          node -e 'const fs=require("fs"),f="capacitor.config.json",c=JSON.parse(fs.readFileSync(f));c.appId+=".lokal";c.appName="Einkauf lokal";fs.writeFileSync(f,JSON.stringify(c,null,2))'
          npx cap add android
          npx cap sync android
          bash apk-bauen.sh icons/lokal-192.png Einkaufsliste-lokal.apk

      # Jede Version bleibt als eigenes Release erhalten; die neueste ist "Latest",
      # daher funktioniert .../releases/latest/download/Einkaufsliste.apk (bzw. Einkaufsliste-lokal.apk) weiter.
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node release-text.mjs "$VERSION" > release-text.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Einkaufsliste.apk Einkaufsliste-lokal.apk --clobber
          else
            gh release create "v$VERSION" Einkaufsliste.apk Einkaufsliste-lokal.apk --latest \
              --title "Einkaufsliste $VERSION ($(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M'))" \
              --notes-file release-text.md
          fi
