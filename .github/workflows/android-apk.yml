name: Android-App bauen

# Ein neues Release (v<VERSION>) entsteht nur, wenn die Versionsnummer in version.js erhöht wurde.
# Manuell gestartet ("Run workflow") wird immer gebaut; die APK der aktuellen Version wird dann ersetzt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      bauen: ${{ steps.v.outputs.bauen }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummer lesen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" version.js)
          [ -n "$VERSION" ] || { echo "::error::Keine VERSION in version.js"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "bauen=nein" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION gibt es schon – kein neues Release. Für ein Update version.js hochzählen."
          else
            echo "bauen=ja" >> $GITHUB_OUTPUT
          fi

  apk:
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web-Dateien nach www kopieren
        run: |
          mkdir -p www
          cp -r index.html app.js merge.js sort.js version.js catalog.js style.css manifest.webmanifest icons www/

      - name: Einrichtungslink einbauen (Secret EINRICHTUNGSLINK)
        env:
          LINK: ${{ secrets.EINRICHTUNGSLINK }}
        run: |
          if [ -n "$LINK" ]; then
            node -e 'require("fs").writeFileSync("www/preset.json", JSON.stringify({ link: process.env.LINK.trim() }))'
            echo "Einrichtungslink eingebaut."
          else
            echo "::warning::Kein Secret EINRICHTUNGSLINK gesetzt – App muss von Hand eingerichtet werden."
          fi

      - name: Capacitor installieren und Android-Projekt anlegen
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: App-Symbol und Versionsnummer setzen
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*dpi; do
            cp icons/icon-192.png $d/ic_launcher.png
            cp icons/icon-192.png $d/ic_launcher_round.png
          done
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Gleicher Signierschlüssel bei jedem Build, damit Updates über die alte Version passen.
      # shortcut: GitHub löscht den Cache nach 7 Tagen ohne Build – dann neuer Schlüssel, App einmal neu installieren.
      - name: Signierschlüssel aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: APK bauen
        run: cd android && ./gradlew assembleDebug --no-daemon

      # Jede Version bleibt als eigenes Release erhalten; die neueste ist "Latest",
      # daher funktioniert .../releases/latest/download/Einkaufsliste.apk weiter.
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          AENDERUNG: ${{ github.event.head_commit.message || 'Manuell neu gebaut' }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Einkaufsliste.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Einkaufsliste.apk --clobber
          else
            gh release create "v$VERSION" Einkaufsliste.apk --latest \
              --title "Einkaufsliste $VERSION ($(TZ=Europe/Berlin date '+%d.%m.%Y'))" \
              --notes "Änderung: $AENDERUNG

          Android: herunterladen und über die alte Version installieren (oder in der App auf „Herunterladen“ tippen).
          iPhone/PC: App neu öffnen bzw. in der App „Neu laden“."
          fi
